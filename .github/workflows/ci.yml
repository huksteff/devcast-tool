name: CI

# Проверка каждого MR (CONTRIBUTING.md). Без зелёного CI MR не вливается.
# После вливания тот же код заново не проверяется: develop и main принимают только MR, уже
# прошедшие эту проверку. Ночной прогон проверяет develop целиком и обновляет кэш сборки,
# из которого берут все MR.
on:
  pull_request:
  # Ночной прогон с долгими тестами (#[ignore]). GitHub запускает расписание только на ветке по умолчанию (develop).
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Новый пуш в тот же MR отменяет старую проверку.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Short build folder: MSBuild of whisper.cpp fails on paths over 260 characters (docs/SETUP.md, step 6).
  CARGO_TARGET_DIR: D:/t
  # No debug info: nobody debugs on the CI machine, and the build and its cache get smaller.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Две половины verify идут на двух машинах сразу: clippy и тесты собирают проект каждый
  # по-своему и общего у них нет.
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/build-deps

      - name: verify (fmt, clippy, правила)
        run: cargo xtask verify --checks

  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Фикстуры в Git LFS: трафик LFS ограничен, поэтому они берутся из кэша, пока не изменились.
      - name: LFS file list
        run: git lfs ls-files --long | Out-File -Encoding utf8 .lfs-files

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-files') }}

      - name: LFS pull
        run: git lfs pull

      - uses: ./.github/actions/build-deps

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: verify (тесты)
        if: github.event_name != 'schedule'
        run: cargo xtask verify --full --tests

      - name: verify (тесты с долгими)
        if: github.event_name == 'schedule'
        run: cargo xtask verify --full --tests --include-ignored

  # Обязательная проверка в защите веток называется `verify`: она зелёная, когда зелёные обе половины.
  verify:
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-latest
    steps:
      - name: обе половины зелёные
        if: needs.checks.result != 'success' || needs.tests.result != 'success'
        run: exit 1
