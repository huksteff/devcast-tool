name: CI

# Проверка каждого MR и каждой ветки, куда вливают (CONTRIBUTING.md). Без зелёного CI MR не вливается.
on:
  push:
    branches: [main, develop]
  pull_request:
  # Ночной прогон с долгими тестами (#[ignore]). GitHub запускает расписание только на ветке по умолчанию (develop).
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Новый пуш в тот же MR отменяет старую проверку.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Фикстуры в Git LFS: трафик LFS ограничен, поэтому они берутся из кэша, пока не изменились.
      - name: LFS file list
        run: git lfs ls-files --long | Out-File -Encoding utf8 .lfs-files

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-files') }}

      - name: LFS pull
        run: git lfs pull

      - uses: ./.github/actions/build-deps

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: verify
        if: github.event_name != 'schedule'
        run: cargo xtask verify --full

      - name: verify (с долгими тестами)
        if: github.event_name == 'schedule'
        run: cargo xtask verify --full --include-ignored
