[alias]
xtask = "run --quiet --package xtask --"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Нативные зависимости сборки в .deps/ (ставит `cargo xtask deps`, решение 003)
[env]
FFMPEG_DIR = { value = ".deps/ffmpeg", relative = true }
LIBCLANG_PATH = { value = ".deps/libclang", relative = true }
CMAKE = { value = ".deps/cmake/bin/cmake.exe", relative = true }
