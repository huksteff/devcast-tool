[package]
name = "xtask"
description = "Project checks (verify) and maintenance commands: cargo xtask <command>."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# schema_docs parses Rust items; both are already in the lockfile via serde_derive/thiserror.
# span-locations gives line numbers for the report.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", default-features = false, features = ["full", "parsing"] }

[dev-dependencies]
tempfile.workspace = true
