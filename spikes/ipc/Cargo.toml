[package]
name = "spike-ipc"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "inspection", "accesskit"] }
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
