# Пробы этапа 1 (docs/roadmap/01-spikes.md). Одноразовый код: отдельный workspace,
# не входит в основной и не проверяется xtask. Выводы переносятся в docs/decisions/.
[workspace]
resolver = "3"
members = ["hud", "windows", "video", "render", "text", "export", "capture", "audio", "hooks", "whisper", "ipc", "kittest"]

[workspace.package]
edition = "2024"
publish = false
