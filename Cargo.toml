[workspace]
resolver = "3"
members = ["crates/*", "fx/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[workspace.lints.rust]
# unsafe разрешён только в capture, encode и модуле crash.rs dc-app через #[allow(unsafe_code, reason = "...")]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# порог задан в clippy.toml (80 строк)
too_many_lines = "deny"
# каждый #[allow] обязан объяснять причину: #[allow(lint, reason = "...")]
allow_attributes_without_reason = "deny"
# у каждого unsafe-блока комментарий // SAFETY: (docs/ARCHITECTURE.md, «Правила кода»)
undocumented_unsafe_blocks = "deny"

# Общие версии внешних зависимостей: крейты пишут `serde.workspace = true`.
[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
thiserror = "2"
proptest = "1.12"
insta = { version = "1.49", features = ["json"] }
tempfile = "3"
sha2 = "0.11"
# HTTP for model downloads: blocking, rustls, no async runtime (docs/decisions/010-whisper.md).
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# Must stay the wgpu of egui-wgpu 0.37: the window and the renderer share one device.
wgpu = "30"

# whisper.cpp is built by CMake in the mode of this level: without it a dev build recognizes
# speech tens of times slower (decision 010).
[profile.dev.package.whisper-rs-sys]
opt-level = 3
