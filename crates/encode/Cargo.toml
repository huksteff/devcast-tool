[package]
name = "dc-encode"
description = "Live encoding while recording, frames as PNG, MP4 and GIF export, encoder self-test, export queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dc-core = { path = "../core" }
dc-media = { path = "../media" }
dc-project = { path = "../project" }
dc-render = { path = "../render" }
ffmpeg-next = "9"
# GIF (ARCHITECTURE); imgref and rgb are the frame types of its API.
gifski = { version = "1.34", default-features = false, features = ["gifsicle"] }
imgref = "1.11"
rgb = { version = "0.8.50", default-features = false }
thiserror.workspace = true

[dev-dependencies]
dc-render = { path = "../render", features = ["golden"] }
serde_json.workspace = true
tempfile.workspace = true
