[package]
name = "dc-app"
description = "DevCast desktop app: HUD, recording windows, editor, timeline, library, settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "devcast-app"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
crash-handler = "0.6"
dc-capture = { path = "../capture" }
dc-core = { path = "../core" }
dc-audio = { path = "../audio" }
dc-encode = { path = "../encode" }
dc-fx-annotations = { path = "../../fx/annotations" }
dc-fx-audio-tracks = { path = "../../fx/audio-tracks" }
dc-fx-blur = { path = "../../fx/blur" }
dc-fx-callout = { path = "../../fx/callout" }
dc-fx-captions = { path = "../../fx/captions" }
dc-fx-crop = { path = "../../fx/crop" }
dc-fx-cursor = { path = "../../fx/cursor" }
dc-fx-cut = { path = "../../fx/cut" }
dc-fx-drawing = { path = "../../fx/drawing" }
dc-fx-image = { path = "../../fx/image" }
dc-fx-keys = { path = "../../fx/keys" }
dc-fx-shape = { path = "../../fx/shape" }
dc-fx-text = { path = "../../fx/text" }
dc-fx-zoom = { path = "../../fx/zoom" }
dc-ipc = { path = "../ipc" }
dc-media = { path = "../media" }
dc-models = { path = "../models" }
dc-ops = { path = "../ops" }
dc-project = { path = "../project" }
dc-render = { path = "../render" }
dc-settings = { path = "../settings" }
dc-ui-kit = { path = "../ui-kit" }
dirs = "6"
global-hotkey = "0.9"
minidumper = "0.8"
# `inspection` stays off at run time until EGUI_INSPECTION=1 is set (decision 012).
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "inspection"] }
raw-window-handle = "0.6"
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tray-icon = "0.26"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
dc-ui-kit = { path = "../ui-kit", features = ["kittest"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
tempfile.workspace = true
